name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-levels: 31
        build-tools-version: '33.0.0'
    
    - name: Navigate to mobile directory
      run: cd mobile && npm install
    
    - name: Build APK
      run: cd mobile && npm run build-apk
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: Toolencahnt-APK
        path: Toolencahnt-release.apk
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: Automated APK release build
        draft: false
        prerelease: false
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: Toolencahnt-release.apk
        asset_name: Toolencahnt-release.apk
        asset_content_type: application/vnd.android.package-archive
